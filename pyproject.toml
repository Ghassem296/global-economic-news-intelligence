[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "global-economic-news-intelligence"
version = "0.1.0"
description = "Event-centric global economic news intelligence platform"
readme = "README.md"
requires-python = ">=3.15,<3.16"
authors = [{ name = "GENI Project" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
geni = "global_economic_news_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py315"
include = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  "tools/**/*.py",
]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
# Documentation validator and PoC evidence tools embed long literal strings.
"scripts/**/*.py" = ["E501"]
"tools/**/*.py" = ["E501"]
"tests/test_validate_docs.py" = ["E501"]

[tool.mypy]
python_version = "3.15"
strict = true
mypy_path = "src"
packages = ["global_economic_news_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
required-version = "==0.13.9"
