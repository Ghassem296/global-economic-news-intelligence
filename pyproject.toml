[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "global-economic-news-intelligence"
version = "0.1.0"
description = "Event-centric global economic news intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "GENI Project" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
geni = "global_economic_news_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
include = ["src/**/*.py", "tests/unit/**/*.py"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["global_economic_news_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
