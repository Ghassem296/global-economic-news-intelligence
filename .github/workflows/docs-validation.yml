name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-documentation:
    name: Validate documentation registry and ADR inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run documentation validator unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate controlled document versions and ADR inventory
        run: python scripts/validate_docs.py
