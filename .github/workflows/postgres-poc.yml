name: PostgreSQL persistence PoC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-poc:
    name: PostgreSQL 18.7 / Python 3.15 correctness PoC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7@sha256:32f5fdbf4d27ebe0d4552313126a593400f40b21bff207e43617b2305838bce3
        env:
          POSTGRES_DB: geni_poc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: poc_only_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geni_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GENI_POC_DATABASE_URL: postgresql://postgres:poc_only_ephemeral@localhost:5432/geni_poc

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"

      - name: Install isolated PoC dependency
        run: python -m pip install --disable-pip-version-check --requirement tools/postgres_poc/requirements.txt

      - name: Capture PostgreSQL image digest and container ID
        id: postgres-image
        run: |
          echo "digest=$(docker image inspect postgres:18.7@sha256:32f5fdbf4d27ebe0d4552313126a593400f40b21bff207e43617b2305838bce3 --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
          echo "container_id=$(docker ps --filter ancestor=postgres:18.7@sha256:32f5fdbf4d27ebe0d4552313126a593400f40b21bff207e43617b2305838bce3 --format '{{.ID}}' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL correctness and recovery PoC
        env:
          GENI_POC_POSTGRES_IMAGE_DIGEST: ${{ steps.postgres-image.outputs.digest }}
          GENI_POC_POSTGRES_CONTAINER_ID: ${{ steps.postgres-image.outputs.container_id }}
        run: python tools/postgres_poc/run_poc.py

      - name: Upload machine-readable PoC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-poc-${{ github.sha }}
          path: tools/postgres_poc/results/poc-results.json
          if-no-files-found: warn
          retention-days: 30
