name: Dependency lock bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve dependencies on Python 3.15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"

      - name: Resolve lockfile
        run: uv lock --python 3.15

      - name: Verify locked installation
        run: uv sync --locked --extra dev

      - name: Run quality checks with the resolved environment
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev mypy
          uv run --locked --extra dev pytest

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: geni-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit lockfile to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp uv.lock /tmp/geni-uv.lock
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/geni-uv.lock uv.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: add Python 3.15 dependency lockfile"
          git push origin main
