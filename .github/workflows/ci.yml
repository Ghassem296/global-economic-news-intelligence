name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.15 quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version-file: pyproject.toml
          python-version: "3.15"
          cache-dependency-glob: uv.lock

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install locked package and development dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run --locked --no-sync ruff check .

      - name: Run mypy
        run: uv run --locked --no-sync mypy

      - name: Run tests
        run: uv run --locked --no-sync pytest
